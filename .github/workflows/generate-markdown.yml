name: Generate Markdown from XML

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'xml/**/*.xml'
      - 'tools/xml2md.py'
  pull_request:
    paths:
      - 'xml/**/*.xml'
      - 'tools/xml2md.py'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-markdown:
    name: Generate Markdown Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Generate markdown files
        run: |
          echo "Generating markdown files from XML sources..."
          python3 tools/xml2md.py xml/ -o markdown/ --preserve-structure
          echo "✓ Markdown generation complete"
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet markdown/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in markdown files"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in markdown files"
          fi
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add markdown/
          git commit -m "Auto-generate markdown files from XML sources

          Generated by GitHub Actions workflow
          Triggered by commit ${{ github.sha }}"
          git push
      
      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true' && github.event_name == 'pull_request'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-generate markdown files from XML sources"
          title: "Auto-generated: Update markdown files"
          body: |
            This PR contains automatically generated markdown files based on changes to XML sources.
            
            **Changes:**
            - Regenerated markdown files from updated XML sources
            - Generated by GitHub Actions workflow
            
            **Source PR:** #${{ github.event.pull_request.number }}
          branch: auto-markdown-${{ github.event.pull_request.number }}
          delete-branch: true
